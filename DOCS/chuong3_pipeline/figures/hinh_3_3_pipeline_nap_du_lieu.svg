<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .step-title { font: 700 21px Arial, sans-serif; fill: #111827; }
      .step-text { font: 400 16px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .note { font: 400 15px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1500" height="780" fill="#ffffff"/>
  <text x="750" y="54" text-anchor="middle" class="title">Hình 3.3. Pipeline nạp dữ liệu vào kho tri thức</text>
  <text x="750" y="86" text-anchor="middle" class="subtitle">Quy trình biến tài liệu lịch sử thành vector để chatbot truy xuất khi trả lời</text>

  <g filter="url(#shadow)">
    <rect x="95" y="210" width="210" height="145" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="200" y="248" text-anchor="middle" class="step-title">1. Tài liệu nguồn</text>
    <text x="200" y="286" text-anchor="middle" class="step-text">PDF, DOCX, TXT</text>
    <text x="200" y="314" text-anchor="middle" class="step-text">nội dung lịch sử</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="210" width="210" height="145" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="485" y="248" text-anchor="middle" class="step-title">2. Đọc tài liệu</text>
    <text x="485" y="286" text-anchor="middle" class="step-text">PyMuPDFLoader</text>
    <text x="485" y="314" text-anchor="middle" class="step-text">Text, Docx loader</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="210" width="210" height="145" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="770" y="248" text-anchor="middle" class="step-title">3. Chia đoạn</text>
    <text x="770" y="286" text-anchor="middle" class="step-text">Chunk văn bản</text>
    <text x="770" y="314" text-anchor="middle" class="step-text">có overlap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="210" width="230" height="145" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1065" y="248" text-anchor="middle" class="step-title">4. Embedding</text>
    <text x="1065" y="286" text-anchor="middle" class="step-text">OpenAI, Vertex AI</text>
    <text x="1065" y="314" text-anchor="middle" class="step-text">hoặc HuggingFace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="210" width="180" height="145" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="1350" y="248" text-anchor="middle" class="step-title">5. FAISS</text>
    <text x="1350" y="286" text-anchor="middle" class="step-text">Lưu vector</text>
    <text x="1350" y="314" text-anchor="middle" class="step-text">và metadata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="500" width="480" height="135" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="750" y="540" text-anchor="middle" class="step-title">Kết quả phục vụ chatbot RAG</text>
    <text x="750" y="579" text-anchor="middle" class="step-text">Khi người dùng đặt câu hỏi, retriever tìm các chunk gần nghĩa</text>
    <text x="750" y="607" text-anchor="middle" class="step-text">và chuyển chúng thành ngữ cảnh cho mô hình ngôn ngữ lớn</text>
  </g>

  <path d="M 305 282 C 335 282, 350 282, 380 282" class="arrow"/>
  <path d="M 590 282 C 620 282, 635 282, 665 282" class="arrow"/>
  <path d="M 875 282 C 905 282, 920 282, 950 282" class="arrow"/>
  <path d="M 1180 282 C 1210 282, 1230 282, 1260 282" class="arrow"/>
  <path d="M 1350 355 C 1350 445, 990 445, 920 500" class="arrow"/>
  <path d="M 750 500 C 660 440, 760 395, 770 355" class="arrow"/>

  <text x="750" y="685" text-anchor="middle" class="note">Các module liên quan trong code: ingestion.py, vectorize.py, retriever.py, service_manager.py</text>
</svg>
