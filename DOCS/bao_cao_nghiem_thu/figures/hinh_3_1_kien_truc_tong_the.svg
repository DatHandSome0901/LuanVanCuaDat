<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 16px Arial, sans-serif; fill: #334155; }
      .label { font: 700 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .soft-arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 7 7; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="54" text-anchor="middle" class="title">Hình 3.1. Pipeline tổng quan hệ thống Chatbot Lịch sử Việt Nam</text>
  <text x="750" y="86" text-anchor="middle" class="subtitle">Luồng dữ liệu từ người dùng đến backend, chatbot RAG, cơ sở dữ liệu và dịch vụ bên ngoài</text>

  <rect x="70" y="140" width="1360" height="540" rx="22" class="lane"/>

  <g filter="url(#shadow)">
    <rect x="105" y="215" width="190" height="150" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="200" y="252" text-anchor="middle" class="box-title">Người dùng</text>
    <text x="200" y="287" text-anchor="middle" class="box-text">Đặt câu hỏi</text>
    <text x="200" y="313" text-anchor="middle" class="box-text">Xem lịch sử</text>
    <text x="200" y="339" text-anchor="middle" class="box-text">Nạp token</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="195" width="220" height="190" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="470" y="232" text-anchor="middle" class="box-title">Frontend</text>
    <text x="470" y="267" text-anchor="middle" class="box-text">React, TypeScript</text>
    <text x="470" y="293" text-anchor="middle" class="box-text">ChatView, AdminView</text>
    <text x="470" y="319" text-anchor="middle" class="box-text">PaymentView, Profile</text>
    <text x="470" y="345" text-anchor="middle" class="box-text">Web và Android</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="195" width="220" height="190" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="755" y="232" text-anchor="middle" class="box-title">Backend API</text>
    <text x="755" y="267" text-anchor="middle" class="box-text">FastAPI</text>
    <text x="755" y="293" text-anchor="middle" class="box-text">Auth, Chatbot</text>
    <text x="755" y="319" text-anchor="middle" class="box-text">Payment, Admin</text>
    <text x="755" y="345" text-anchor="middle" class="box-text">JWT và phân quyền</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="195" width="230" height="190" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1045" y="232" text-anchor="middle" class="box-title">Chatbot RAG</text>
    <text x="1045" y="267" text-anchor="middle" class="box-text">Chuẩn hóa câu hỏi</text>
    <text x="1045" y="293" text-anchor="middle" class="box-text">Truy xuất FAISS</text>
    <text x="1045" y="319" text-anchor="middle" class="box-text">Lọc tài liệu</text>
    <text x="1045" y="345" text-anchor="middle" class="box-text">Sinh câu trả lời</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1215" y="195" width="180" height="190" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1305" y="232" text-anchor="middle" class="box-title">LLM</text>
    <text x="1305" y="267" text-anchor="middle" class="box-text">OpenAI GPT</text>
    <text x="1305" y="293" text-anchor="middle" class="box-text">Gemini</text>
    <text x="1305" y="319" text-anchor="middle" class="box-text">Vertex AI</text>
    <text x="1305" y="345" text-anchor="middle" class="box-text">Ollama local</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="470" width="230" height="130" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="615" y="508" text-anchor="middle" class="box-title">SQLite</text>
    <text x="615" y="543" text-anchor="middle" class="box-text">Users, messages</text>
    <text x="615" y="569" text-anchor="middle" class="box-text">Payments, settings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="470" width="230" height="130" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="995" y="508" text-anchor="middle" class="box-title">FAISS</text>
    <text x="995" y="543" text-anchor="middle" class="box-text">Kho vector tài liệu</text>
    <text x="995" y="569" text-anchor="middle" class="box-text">Tìm kiếm ngữ nghĩa</text>
  </g>

  <path d="M 295 290 C 322 290, 333 290, 360 290" class="arrow"/>
  <path d="M 580 290 C 607 290, 618 290, 645 290" class="arrow"/>
  <path d="M 865 290 C 892 290, 903 290, 930 290" class="arrow"/>
  <path d="M 1160 290 C 1187 290, 1188 290, 1215 290" class="arrow"/>

  <path d="M 760 385 C 760 430, 680 430, 640 470" class="soft-arrow"/>
  <path d="M 1035 385 C 1035 430, 1005 430, 1000 470" class="soft-arrow"/>
  <path d="M 995 470 C 955 430, 940 420, 1000 385" class="soft-arrow"/>

  <text x="327" y="270" text-anchor="middle" class="label">HTTP/API</text>
  <text x="612" y="270" text-anchor="middle" class="label">REST</text>
  <text x="897" y="270" text-anchor="middle" class="label">Điều phối</text>
  <text x="1188" y="270" text-anchor="middle" class="label">Prompt</text>
  <text x="720" y="437" text-anchor="middle" class="label">Lưu nghiệp vụ</text>
  <text x="1100" y="437" text-anchor="middle" class="label">Truy xuất tri thức</text>
</svg>
